<dl class="shopping-totals">
    <div><dt>Preču summa</dt><dd>{{ '%.2f'|format(subtotal) }} €</dd></div>
    <div><dt>Piegāde</dt><dd>{{ '%.2f'|format(delivery_total) }} €</dd></div>
    <div class="shopping-grand-total"><dt>Kopsumma</dt><dd>{{ '%.2f'|format(total) }} €</dd></div>
</dl>
<div class="summary-tax-note"><p class="field-hint">{{ vat_note }}</p><p class="field-hint">Piegādes maksas summētas par katru piedāvājumu.</p></div>
