<header class="market-header">
    <div class="header-top">
        <a class="brand" href="{{ url_for('index') }}" aria-label="StockFlow sākumlapa">
            <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
            <span>Stock<span class="brand-accent">Flow</span></span>
        </a>
        <nav class="header-actions" aria-label="Navigācija">
            <a href="{{ url_for('catalog.catalog_page') }}">Katalogs</a>
            <a href="{{ url_for('cart.cart_page') }}">Grozs</a>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('auth.profile') }}">Mans profils</a>
                {% if current_user.role == 'admin' %}<a href="{{ url_for('admin.products') }}">Preces</a>{% endif %}
                <a href="{{ url_for('auth.logout') }}">Iziet</a>
            {% else %}
                <a href="{{ url_for('auth.login', next=request.full_path) }}">Pieslēgties</a>
            {% endif %}
        </nav>
    </div>
</header>
