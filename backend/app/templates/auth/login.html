<!doctype html>
<html lang="lv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pieslēgties | StockFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="account-page">
    {% include '_market_header.html' %}
    <main id="main-content" class="account-content account-layout">
        <section class="account-card" aria-labelledby="login-title">
            <p class="account-kicker">Laipni lūdzam atpakaļ</p>
            <h1 id="login-title">Pieslēgties</h1>
            <p class="account-help">Ievadiet sava uzņēmuma konta piekļuves datus.</p>
            {% include '_messages.html' %}
            <form method="post" class="account-form">
                <input type="hidden" name="next" value="{{ next_url }}">
                <div class="form-field">
                    <label for="email">E-pasts</label>
                    <input id="email" name="email" type="email" value="{{ request.form.get('email', '') }}" required autocomplete="email" placeholder="vards@uznemums.lv">
                </div>
                <div class="form-field">
                    <label for="password">Parole</label>
                    <input id="password" name="password" type="password" required autocomplete="current-password">
                </div>
                <button class="admin-primary-button" type="submit">Pieslēgties <span aria-hidden="true">→</span></button>
            </form>
            <p class="account-switch">Vēl nav konta? <a href="{{ url_for('auth.register') }}">Reģistrēties</a></p>
        </section>
    </main>
    {% include '_footer.html' %}
</body>
</html>
