<!doctype html>
<html lang="lv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reģistrēties | StockFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <main class="auth-card auth-card-wide">
        <a class="brand" href="{{ url_for('index') }}">Stock<span class="brand-accent">Flow</span></a>
        <p class="section-kicker">Sāciet iepirkties gudrāk</p>
        <h1>Izveidot kontu</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}<p class="flash flash-{{ category }}">{{ message }}</p>{% endfor %}
        {% endwith %}
        <form method="post" class="auth-form">
            <label for="full_name">Vārds un uzvārds</label>
            <input id="full_name" name="full_name" value="{{ request.form.get('full_name', '') }}" required autocomplete="name">
            <label for="email">E-pasts</label>
            <input id="email" name="email" type="email" value="{{ request.form.get('email', '') }}" required autocomplete="email">
            <div class="auth-grid">
                <div><label for="password">Parole</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"></div>
                <div><label for="password_confirmation">Atkārtot paroli</label><input id="password_confirmation" name="password_confirmation" type="password" required minlength="8" autocomplete="new-password"></div>
            </div>
            <label for="company_name">Uzņēmuma nosaukums</label>
            <input id="company_name" name="company_name" value="{{ request.form.get('company_name', '') }}" required>
            <div class="auth-grid">
                <div><label for="registration_no">Reģistrācijas numurs</label><input id="registration_no" name="registration_no" value="{{ request.form.get('registration_no', '') }}" required></div>
                <div><label for="vat_no">PVN numurs</label><input id="vat_no" name="vat_no" value="{{ request.form.get('vat_no', '') }}"></div>
            </div>
            <label for="address">Uzņēmuma adrese</label>
            <input id="address" name="address" value="{{ request.form.get('address', '') }}" required autocomplete="street-address">
            <label for="phone">Tālrunis</label>
            <input id="phone" name="phone" type="tel" value="{{ request.form.get('phone', '') }}" autocomplete="tel">
            <button type="submit">Izveidot kontu</button>
        </form>
        <p class="auth-switch">Jau ir konts? <a href="{{ url_for('auth.login') }}">Pieslēgties</a></p>
    </main>
</body>
</html>
