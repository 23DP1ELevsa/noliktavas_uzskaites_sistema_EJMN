{% if order.status == 'noraidīts' or order.admin_note %}
<div class="order-note {{ 'order-note-declined' if order.status == 'noraidīts' else '' }}">
    <h3>{{ 'Noraidīšanas iemesls' if order.status == 'noraidīts' else 'Administratora komentārs' }}</h3>
    <p>{{ order.admin_note or 'Noraidīšanas iemesls nav norādīts.' }}</p>
</div>
{% endif %}
