services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: stockflow
      MYSQL_USER: stockflow
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-stockflow}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-stockflow-local-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --host=127.0.0.1 --user=stockflow --database=stockflow --execute='SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
